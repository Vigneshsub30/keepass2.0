# ─────────────────────────────────────────────────────────────────────────────
# build.yml — Three-Platform Signed Build Matrix (WO-101)
#
# Produces signed, distributable artifacts for six RID targets across three
# platforms on every push to main and on every pull request.
#
# Matrix entries:
#   windows-latest / win-x64   — MSI + portable ZIP (Authenticode-signed)
#   windows-latest / win-arm64 — MSI + portable ZIP (Authenticode-signed)
#   macos-14       / osx-arm64 — .app in .dmg (Developer ID + notarized)
#   macos-13       / osx-x64   — .app in .dmg (Developer ID + notarized)
#   ubuntu-latest  / linux-x64 — .deb + AppImage (GPG-signed checksums)
#
# Signing is conditional on branch/tag + repository variables so pull requests
# from forks never trigger signing with real credentials.
#
# Secrets required for signing (set in repository/environment secrets):
#   Windows Authenticode (Azure Trusted Signing):
#     AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   macOS Developer ID:
#     APPLE_DEVELOPER_ID_CERTIFICATE (base64-encoded .p12)
#     APPLE_DEVELOPER_ID_PASSWORD    (.p12 passphrase)
#     APPLE_API_KEY_CONTENT          (.p8 App Store Connect key)
#     APPLE_API_KEY_ID               (10-char key ID)
#     APPLE_API_ISSUER_ID            (UUID)
#   Linux GPG:
#     LINUX_GPG_SIGNING_KEY  (ASCII-armored private key)
#     LINUX_GPG_KEY_ID       (key fingerprint)
#     LINUX_GPG_PASSPHRASE   (key passphrase)
#
# Variables required (repository-level variables):
#   SIGNING_ENABLED          — "true" to enable Windows Authenticode
#   AZURE_TRUSTED_SIGNING_ACCOUNT — Azure Trusted Signing account name
#   AZURE_CERTIFICATE_PROFILE     — Azure certificate profile name
#   MACOS_SIGNING_ENABLED    — "true" to enable macOS signing + notarization
#   LINUX_SIGNING_ENABLED    — "true" to enable Linux GPG signing
# ─────────────────────────────────────────────────────────────────────────────
name: Build

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write     # OIDC federation for Azure Trusted Signing and attestation
  attestations: write # SLSA build-provenance attestation

# Cancel superseded runs on the same branch (saves CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build / ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: true   # fail-fast=true: any platform failure blocks the entire matrix
      matrix:
        include:
          # Windows — x64 (primary release target)
          - os:  windows-latest
            rid: win-x64
            arch: x64

          # Windows — ARM64 (native ARM build for Surface Pro X / Snapdragon laptops)
          - os:  windows-latest
            rid: win-arm64
            arch: arm64

          # macOS — Apple Silicon (macos-14 = M1/M2 runner)
          - os:  macos-14
            rid: osx-arm64
            arch: arm64

          # macOS — Intel (macos-13 = last Intel runner in GitHub's fleet)
          - os:  macos-13
            rid: osx-x64
            arch: x64

          # Linux — x64 (primary Linux release target)
          - os:  ubuntu-latest
            rid: linux-x64
            arch: x64

    env:
      # Strip leading 'v' from tag refs (set in a later step for tag pushes).
      KEEPASS_VERSION: ""
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts/${{ matrix.rid }}

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────── #
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for git describe in version step

      # ── Version resolution ────────────────────────────────────────────────── #
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            # Non-release builds use a pre-release version derived from git.
            VER=$(git describe --tags --match "v[0-9]*" --abbrev=7 2>/dev/null \
                  | sed 's/^v//' \
                  || echo "0.0.0-dev")
          fi
          echo "KEEPASS_VERSION=${VER}" >> "${GITHUB_ENV}"
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version: ${VER}"

      # ── Toolchain setup ──────────────────────────────────────────────────── #
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ── Restore ──────────────────────────────────────────────────────────── #
      - name: Restore NuGet packages
        run: dotnet restore KeePass.sln

      # ── Build ─────────────────────────────────────────────────────────────── #
      # ContinuousIntegrationBuild=true is already set in Directory.Build.props
      # when the CI env var is present (GitHub Actions sets CI=true).
      # Deterministic=true is set unconditionally in Directory.Build.props.
      - name: Build — Release
        run: >
          dotnet build KeePass.sln
          --configuration Release
          --no-restore

      # ── Tests (Windows only — net10.0-windows requires WinDesktop runtime) ── #
      - name: Run unit tests
        if: runner.os == 'Windows'
        run: >
          dotnet test KeePass.Tests/KeePass.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --verbosity normal

      - name: Upload test results
        if: runner.os == 'Windows' && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.rid }}
          path: KeePass.Tests/TestResults/*.trx
          if-no-files-found: warn

      # ── Publish (self-contained, single-file where applicable) ───────────── #
      # The main KeePass project targets net10.0-windows so it cross-compiles
      # correctly on all runners when EnableWindowsTargeting=true (Directory.Build.props).
      - name: Publish — ${{ matrix.rid }}
        run: >
          dotnet publish KeePass/KeePass.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output "${{ env.ARTIFACT_DIR }}/publish"
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:Version=${{ steps.version.outputs.version }}

      # ── Log assembly hashes (determinism check) ───────────────────────────── #
      - name: Log assembly hashes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem "${{ env.ARTIFACT_DIR }}/publish" -Filter "*.exe","*.dll" |
            ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 } |
            Select-Object Hash,@{N='File';E={$_.Path | Split-Path -Leaf}} |
            Format-Table -AutoSize

      - name: Log assembly hashes (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          find "${{ env.ARTIFACT_DIR }}/publish" \
            \( -name "*.dll" -o -name "KeePass" \) -type f | sort |
            while read f; do
              command -v sha256sum >/dev/null && sha256sum "$f" || shasum -a 256 "$f"
            done

      # ── SBOM generation ───────────────────────────────────────────────────── #
      - name: Install CycloneDX SBOM tool
        run: dotnet tool install --global CycloneDX

      - name: Generate CycloneDX SBOM (JSON)
        run: dotnet CycloneDX KeePass.sln --output sbom/ --json

      - name: Verify SBOM contents
        shell: pwsh
        run: |
          $bom = Get-Content sbom/bom.json -Raw | ConvertFrom-Json
          Write-Host "SBOM component count: $($bom.components.Count)"
          if ($bom.components.Count -eq 0) {
            Write-Error "SBOM has no components — CycloneDX may have failed"
            exit 1
          }

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.rid }}
          path: sbom/bom.json
          if-no-files-found: error

      # ══════════════════════════════════════════════════════════════════════════
      # WINDOWS PACKAGING
      # ══════════════════════════════════════════════════════════════════════════

      # ── Authenticode signing (push to main / version tags only) ──────────── #
      - name: Azure login (OIDC)
        if: >
          runner.os == 'Windows' &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
          vars.SIGNING_ENABLED == 'true'
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binaries (Azure Trusted Signing)
        if: >
          runner.os == 'Windows' &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
          vars.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@v0.4
        with:
          azure-tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name:     ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder:        ${{ env.ARTIFACT_DIR }}/publish
          files-folder-filter: exe,dll
          files-folder-recurse: false
          timestamp-rfc3161:   http://timestamp.acs.microsoft.com
          timestamp-digest:    SHA256

      - name: Verify Authenticode signatures
        if: >
          runner.os == 'Windows' &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
          vars.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $pub = "${{ env.ARTIFACT_DIR }}/publish"
          $failed = $false
          Get-ChildItem $pub -Filter "*.exe","*.dll" | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name) : $($sig.Status)"
            if ($sig.Status -ne 'Valid') { $failed = $true }
          }
          if ($failed) { Write-Error "One or more files have invalid Authenticode signatures"; exit 1 }

      # ── MSI installer ─────────────────────────────────────────────────────── #
      - name: Install WiX Toolset v4
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix
          wix extension add WixToolset.UI.wixext
          wix extension add WixToolset.Util.wixext

      - name: Package MSI installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msiOut = "${{ env.ARTIFACT_DIR }}/packages"
          New-Item -ItemType Directory -Force -Path $msiOut | Out-Null
          & "Build/windows/build-msi.ps1" `
              -Version "${{ steps.version.outputs.version }}" `
              -Arch    "${{ matrix.arch }}" `
              -PublishDir "${{ env.ARTIFACT_DIR }}/publish" `
              -OutputDir  "$msiOut"

      # ── Portable ZIP ─────────────────────────────────────────────────────── #
      - name: Package portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zipOut = "${{ env.ARTIFACT_DIR }}/packages"
          New-Item -ItemType Directory -Force -Path $zipOut | Out-Null
          & "Build/windows/build-portable.ps1" `
              -Version    "${{ steps.version.outputs.version }}" `
              -Arch       "${{ matrix.arch }}" `
              -PublishDir "${{ env.ARTIFACT_DIR }}/publish" `
              -OutputDir  "$zipOut" `
              -RepoRoot   "${{ github.workspace }}"

      - name: Upload Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: KeePass-windows-${{ matrix.rid }}-${{ steps.version.outputs.version }}
          path: ${{ env.ARTIFACT_DIR }}/packages/
          if-no-files-found: error

      # ── SLSA provenance attestation (Windows primary artifacts only) ──────── #
      - name: Attest build provenance
        if: >
          runner.os == 'Windows' &&
          github.event_name == 'push'
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.ARTIFACT_DIR }}/publish/KeePass.exe
            ${{ env.ARTIFACT_DIR }}/publish/KeePassLib.dll

      # ══════════════════════════════════════════════════════════════════════════
      # macOS PACKAGING
      # ══════════════════════════════════════════════════════════════════════════

      - name: Import Developer ID certificate (macOS)
        if: >
          runner.os == 'macOS' &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
          vars.MACOS_SIGNING_ENABLED == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$(mktemp -d)/build.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

          security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"

          CERT_FILE="$(mktemp).p12"
          echo "${CERTIFICATE_BASE64}" | base64 --decode > "${CERT_FILE}"
          security import "${CERT_FILE}" \
            -k "${KEYCHAIN_PATH}" -P "${CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          rm -f "${CERT_FILE}"

          # Export identity string for use in later steps.
          IDENTITY=$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" \
            | grep "Developer ID Application" | head -1 \
            | sed 's/.*"\(.*\)"/\1/')
          echo "APPLE_DEVELOPER_ID=${IDENTITY}" >> "${GITHUB_ENV}"

      - name: Package signed .dmg (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_PATH: /tmp/apple_api.p8
          SKIP_NOTARIZE: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && vars.MACOS_SIGNING_ENABLED == 'true') && 'false' || 'true' }}
        run: |
          # Write API key to temp file (only populated when signing is enabled).
          if [[ "${SKIP_NOTARIZE}" == "false" ]]; then
            echo "${{ secrets.APPLE_API_KEY_CONTENT }}" > /tmp/apple_api.p8
          fi

          mkdir -p "${{ env.ARTIFACT_DIR }}/packages"

          bash Build/macos/build-dmg.sh \
            --version    "${{ steps.version.outputs.version }}" \
            --rid        "${{ matrix.rid }}" \
            --publish-dir "${{ env.ARTIFACT_DIR }}/publish" \
            --output-dir  "${{ env.ARTIFACT_DIR }}/packages" \
            $( [[ "${SKIP_NOTARIZE}" == "true" ]] && echo "--skip-notarize" )

          if [[ -f /tmp/apple_api.p8 ]]; then
            rm -f /tmp/apple_api.p8
          fi
        env:
          APPLE_API_KEY_ID:  ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER:  ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Upload macOS .dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: KeePass-macos-${{ matrix.rid }}-${{ steps.version.outputs.version }}
          path: ${{ env.ARTIFACT_DIR }}/packages/*.dmg
          if-no-files-found: error

      - name: Cleanup macOS keychain
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true

      # ══════════════════════════════════════════════════════════════════════════
      # LINUX PACKAGING
      # ══════════════════════════════════════════════════════════════════════════

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ruby ruby-dev rpm libfuse2 fuse
          sudo gem install fpm --no-document
          wget -q \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "${{ env.ARTIFACT_DIR }}/packages"
          bash Build/linux/build-deb.sh \
            --version    "${{ steps.version.outputs.version }}" \
            --rid        "${{ matrix.rid }}" \
            --publish-dir "${{ env.ARTIFACT_DIR }}/publish" \
            --output-dir  "${{ env.ARTIFACT_DIR }}/packages"

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          bash Build/linux/build-appimage.sh \
            --version    "${{ steps.version.outputs.version }}" \
            --rid        "${{ matrix.rid }}" \
            --publish-dir "${{ env.ARTIFACT_DIR }}/publish" \
            --output-dir  "${{ env.ARTIFACT_DIR }}/packages"

      # ── GPG checksum signing ─────────────────────────────────────────────── #
      - name: Generate and GPG-sign SHA-256 checksums (Linux)
        if: >
          runner.os == 'Linux' &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
          vars.LINUX_SIGNING_ENABLED == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_SIGNING_KEY }}
          GPG_KEY_ID:      ${{ secrets.LINUX_GPG_KEY_ID }}
          GPG_PASSPHRASE:  ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

          PKG_DIR="${{ env.ARTIFACT_DIR }}/packages"
          SHA_FILE="${PKG_DIR}/SHA256SUMS"

          # Generate checksums for all distributable artifacts.
          ( cd "$PKG_DIR" && sha256sum *.deb *.AppImage 2>/dev/null ) > "$SHA_FILE"
          cat "$SHA_FILE"

          # Detached GPG signature.
          echo "${GPG_PASSPHRASE}" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 \
            --detach-sign --armor \
            -u "${GPG_KEY_ID}" \
            --output "${SHA_FILE}.sig" \
            "${SHA_FILE}"

          # Cleanup key from keyring.
          gpg --batch --yes --delete-secret-key "${GPG_KEY_ID}" 2>/dev/null || true

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: KeePass-linux-${{ matrix.rid }}-${{ steps.version.outputs.version }}
          path: |
            ${{ env.ARTIFACT_DIR }}/packages/*.deb
            ${{ env.ARTIFACT_DIR }}/packages/*.AppImage
            ${{ env.ARTIFACT_DIR }}/packages/SHA256SUMS
            ${{ env.ARTIFACT_DIR }}/packages/SHA256SUMS.sig
          if-no-files-found: error

      # ── Workflow summary ──────────────────────────────────────────────────── #
      - name: Emit artifact summary
        if: always()
        shell: bash
        run: |
          echo "## Build Summary — ${{ matrix.rid }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Artifact | SHA-256 |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|----------|---------|" >> "${GITHUB_STEP_SUMMARY}"
          PKG_DIR="${{ env.ARTIFACT_DIR }}/packages"
          if [[ -d "${PKG_DIR}" ]]; then
            find "${PKG_DIR}" \
              \( -name "*.msi" -o -name "*.zip" -o -name "*.dmg" \
                 -o -name "*.deb" -o -name "*.AppImage" \) \
              -type f | sort | while read f; do
                HASH=$(sha256sum "$f" 2>/dev/null | awk '{print $1}' \
                       || shasum -a 256 "$f" | awk '{print $1}')
                echo "| \`$(basename "$f")\` | \`${HASH}\` |"
            done >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "| (no packages produced) | — |" >> "${GITHUB_STEP_SUMMARY}"
          fi
